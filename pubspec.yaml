name: colosynth
description: ColoSynth - 2D Comic Action Combat Game
publish_to: 'none'
version: 0.5.3+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.19.0
  flame_audio: ^2.10.0
  flutter_riverpod: ^3.2.1
  shared_preferences: ^2.3.2
  lottie: ^3.1.0
  intl: ^0.20.2
  crypto: ^3.0.3
  collection: ^1.19.1
  purchases_flutter: ^10.0.0
  google_fonts: ^8.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  google_sign_in: ^7.1.0
  google_mobile_ads: ^9.0.0
  games_services: ^5.0.0
  firebase_messaging: ^16.2.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0
  firebase_remote_config: ^6.4.0
  flutter_local_notifications: ^22.0.0
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  share_plus: ^13.1.0
  in_app_review: ^2.0.10
  model_viewer_plus: ^1.9.3

  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/animation/
    - assets/models/
    - assets/models/posters/
    - assets/fonts/

  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf