plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def googleServicesJson = file("google-services.json")
def googleServicesExample = file("google-services.json.example")
if (!googleServicesJson.exists() && googleServicesExample.exists()) {
    copy {
        from googleServicesExample
        into projectDir
        rename "google-services.json.example", "google-services.json"
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
localPropertiesFile.withReader("UTF-8") { reader ->
    localProperties.load(reader)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.drillacatz.colosynth"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.drillacatz.colosynth"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        debug {
            def localDebugKeystore = file("${rootProject.projectDir}/debug.keystore")
            if (localDebugKeystore.exists()) {
                storeFile = localDebugKeystore
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
        release {
            if (keystoreProperties['storeFile'] != null) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyPassword = keystoreProperties['keyPassword']
                keyAlias = keystoreProperties['keyAlias']
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
        }
        release {
            signingConfig = (keystoreProperties['storeFile'] != null)
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.google.android.gms:play-services-games-v2:20.1.2'
    implementation 'com.google.android.play:integrity:1.6.0'
}

flutter {
    source "../.."
}